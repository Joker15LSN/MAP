[project]
name = "map-observability-backend"
version = "0.1.0"
description = "MAP log analytics backend service"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pymongo>=4.8.0",
  "pydantic>=2.8.0",
  "python-dateutil>=2.9.0"
]

[dependency-groups]
# R2-P2-02: dependency group (not optional extra) so that a clean
# `uv sync --frozen` + `uv run ruff/pytest` works without --extra flags.
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "mongomock>=4.1.2",
  "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "RUF001", "RUF003", "UP042"]
select = ["E", "F", "I", "B", "SIM", "UP", "RUF", "PIE", "BLE"]
