schema_version: "1.1.0"
profile_id: "map-next-stage-2026-08-13"
normative_document: "TODO/下一开发阶段_多智能体运行时收敛与观测融合_黄金任务书.md"
change_control: "ADR plus synchronized document/profile change before implementation"

pinned_dependencies:
  agentscope: "2.0.6"
  opensandbox_server: "0.2.2"
  opensandbox_python_sdk: "0.1.14"
  openviking_server: "0.3.21"
  production_images_require_digest: true
  openapi_or_protocol_digest_required: true

task_registry:
  GLOBAL:
    depends_on: []
    acceptance_ids: [AC-EVIDENCE-01, AC-TENANT-01]
  P0-CONTRACT-01:
    depends_on: []
    acceptance_range: [AC-CONTRACT-01, AC-CONTRACT-08]
  P0-SEC-01:
    depends_on: [P0-CONTRACT-01]
    dependency_exception: "actions 1-2 are independent emergency hotfixes"
    acceptance_range: [AC-SEC-01, AC-SEC-13]
  P0-CFG-AUTH-01:
    depends_on: [P0-CONTRACT-01]
    acceptance_range: [AC-CFG-AUTH-01, AC-CFG-AUTH-05]
  P0-CONV-01:
    depends_on: [P0-CONTRACT-01]
    final_acceptance_depends_on: [P1-RUN-01]
    acceptance_range: [AC-CONV-01, AC-CONV-08]
  P1-RUN-01:
    depends_on: [P0-CONTRACT-01, P0-SEC-01]
    acceptance_range: [AC-RUN-01, AC-RUN-09]
  P1-DAG-01:
    depends_on: [P1-RUN-01]
    acceptance_range: [AC-DAG-01, AC-DAG-07]
  P1-HITL-01:
    depends_on: [P1-RUN-01, P1-DAG-01, P0-SEC-01]
    acceptance_range: [AC-HITL-01, AC-HITL-06]
  P1-PLAN-01:
    depends_on: [P1-DAG-01, P1-HITL-01]
    acceptance_range: [AC-PLAN-01, AC-PLAN-06]
  P1-CTX-01:
    depends_on: [P0-SEC-01, P1-RUN-01]
    acceptance_range: [AC-CTX-01, AC-CTX-09]
  P1-SUB-01:
    depends_on: [P1-RUN-01, P1-DAG-01, P1-CTX-01]
    acceptance_range: [AC-SUB-01, AC-SUB-06]
  P1-OTEL-01:
    depends_on: [P0-CONTRACT-01, P1-RUN-01]
    acceptance_range: [AC-OTEL-01, AC-OTEL-09]
  P1-OBS-01:
    depends_on: [P1-OTEL-01]
    acceptance_range: [AC-OBS-01, AC-OBS-08]
  P1-EVAL-01:
    depends_on: [P1-RUN-01, P1-PLAN-01, P1-OTEL-01]
    soft_depends_on: [P1-OBS-01]
    acceptance_range: [AC-EVAL-01, AC-EVAL-07]
  P1-CONFIG-01:
    depends_on: [P0-CFG-AUTH-01, P0-CONTRACT-01]
    activation_depends_on: [P1-EVAL-01]
    acceptance_range: [AC-CONFIG-01, AC-CONFIG-09]
  P1-API-01:
    depends_on: [P0-CONV-01, P1-RUN-01, P1-DAG-01]
    acceptance_range: [AC-API-01, AC-API-07]
  P1-ENGINE-01:
    depends_on: [P1-EVAL-01, P1-OTEL-01, P1-CTX-01]
    acceptance_range: [AC-ENGINE-01, AC-ENGINE-06]
  P1-CLEAN-DEAD-01:
    depends_on: []
    conditional_dependencies_ref: "golden taskbook section 7.5 ledger"
    acceptance_range: [AC-CLEAN-DEAD-01, AC-CLEAN-DEAD-03]
  P1-CLEAN-BOUNDARY-01:
    depends_on: [P0-CONTRACT-01, P1-API-01]
    acceptance_range: [AC-CLEAN-BOUNDARY-01, AC-CLEAN-BOUNDARY-03]
  P1-CLEAN-STATE-01:
    depends_on: [P1-OBS-01]
    acceptance_range: [AC-CLEAN-STATE-01, AC-CLEAN-STATE-03]
  P1-CLEAN-LLM-01:
    depends_on: [P1-ENGINE-01, P1-OTEL-01]
    acceptance_range: [AC-CLEAN-LLM-01, AC-CLEAN-LLM-03]
  P1-CLEAN-BUILD-01:
    depends_on: [P0-CONTRACT-01]
    acceptance_range: [AC-CLEAN-BUILD-01, AC-CLEAN-BUILD-03]
  P1-RELEASE-01:
    depends_on_all_p0_p1_except_self: true
    final_manifest_requires_independent_acceptor: true
    acceptance_range: [AC-RELEASE-01, AC-RELEASE-05]

canonical_states:
  run:
    - queued
    - running
    - paused
    - completed
    - failed
    - cancelling
    - cancelled
    - timed_out
  step:
    - pending
    - ready
    - running
    - waiting_approval
    - succeeded
    - failed
    - skipped
    - cancelled
  effect:
    - planned
    - approval_required
    - approved
    - executing
    - succeeded
    - failed
    - uncertain
    - reconciling
    - cancelled
  model_invocation:
    - planned
    - sent
    - succeeded
    - failed
    - unknown
    - reconciled
  evidence:
    - not-run
    - running
    - pass
    - fail
    - blocked
    - not-applicable-approved
  legacy_projection:
    message_stopped: cancelled
    rejected_scope: "approval_or_policy_only"

isolation:
  required_partition_key: workspace_id
  optional_organization_key: tenant_id
  p0_matrix:
    workspaces: 3
    principal_types:
      - user
      - service
      - worker
  tenant_enabled_matrix:
    tenants: 3
    workspaces_per_tenant: 3
  hidden_resource_http_status: 404

http_error_mapping:
  missing_invalid_expired_revoked_wrong_audience_credential: 401
  valid_identity_insufficient_principal_or_scope: 403
  cross_workspace_or_hidden_resource: 404
  idempotency_key_body_conflict: 409
  physically_deleted_legacy_route: 404

topology:
  bff_replicas: 2
  run_worker_replicas: 2
  core_worker_replicas: 2
  required_services:
    - postgresql
    - object_store
    - opensandbox_server
    - openviking_server
    - otel_collector
    - trace_backend
    - log_backend
    - metric_backend

remote_services:
  opensandbox:
    integration_mode: authenticated_http_server
    algorithm_adapter: agentscope_opensandbox_workspace
    server_default_port: 8080
    health_path: /health
    auth_header: OPEN-SANDBOX-API-KEY
    insecure_server_allowed: false
    map_core_docker_socket_mounted: false
    map_core_kubeconfig_mounted: false
    host_or_local_fallback_allowed: false
    connect_timeout_ms: 2000
    control_request_timeout_ms: 10000
    create_request_timeout_ms: 60000
    retry_mutation_without_reconciliation: false
    durable_identity_fields:
      - workspace_id
      - run_id
      - step_id
      - attempt_id
      - invocation_id
      - sandbox_id
      - client_request_id
    orphan_gc_max_hours: 24
  openviking:
    integration_mode: authenticated_http_server
    algorithm_adapter: openviking_async_http_memory_client
    server_default_port: 1933
    health_path: /health
    auth_mode: api_key
    root_key_allowed_in_algorithm_runtime: false
    embedded_engine_allowed: false
    direct_storage_access_allowed: false
    mongo_fallback_allowed: false
    workspace_mapping: openviking_account
    principal_mapping: openviking_user
    connect_timeout_ms: 2000
    retrieve_timeout_ms: 3000
    control_request_timeout_ms: 10000
    circuit_breaker:
      consecutive_transient_failures: 5
      reset_timeout_ms: 30000
    write_delivery: durable_pg_outbox_then_http_commit
    retrieve_failure_modes:
      - paused
      - explicit_memory_degraded
    required_operations:
      - health
      - session_append_commit
      - find_search
      - read
      - delete
      - composite_export_via_versioned_list_read
    migration_source: agent_session_memories
    production_source_after_cutover: openviking_only

runtime_timing:
  cancellation:
    command_persist_p95_ms: 1000
    opensandbox_process_tree_terminate_max_ms: 5000
    descendants_settle_max_ms: 30000
  lease:
    ttl_ms: 30000
    heartbeat_interval_ms: 10000
    poll_interval_ms: 2000
    takeover_deadline_formula: "lease_expires_at + 2 * poll_interval"
    stale_owner_successful_commits: 0
  sse:
    transport_delivery: at_least_once
    client_dedupe_key:
      - run_id
      - seq
    missing_terminal_events: 0
    duplicate_rendered_terminal_events: 0

artifacts:
  inline_payload_max_bytes: 65536
  presigned_url_ttl_seconds: 300
  default_retention_days: 30
  abandoned_upload_gc_hours: 24
  required_manifest_fields:
    - artifact_id
    - workspace_id
    - sha256
    - size_bytes
    - content_type
    - policy_labels
    - created_at
    - expires_at

scheduler:
  run_max_concurrency: 8
  workspace_max_active_steps: 32
  deterministic_parallel_fixture:
    branch_count: 2
    branch_duration_ms: 1000
    max_concurrency: 2
    barrier_required_peak_active: 2
    wall_clock_max_ms: 1500
  fairness_fixture:
    workspaces: 4
    queued_steps_per_workspace: 100
    max_continuous_capacity_quanta_without_service: 10
    silent_drops: 0

telemetry:
  semantic_conventions_version: "1.44.0"
  metric_series_per_service_per_metric_max: 5000
  required_spans:
    - bff.server
    - run_worker.core_client
    - map.run
    - map.step_agent
    - gen_ai.model
    - map.tool_mcp
    - map.sandbox.opensandbox_client
    - opensandbox.server
    - map.memory.openviking_client
    - openviking.server
    - map.artifact
    - map.approval
  business_p95_overhead_max_percent: 5
  resident_memory_overhead_max_percent: 10
  durable_fact_delta_across_sampling_modes: 0
  sampling_modes_percent:
    - 0
    - 1
    - 100
  aggregation_tolerance:
    token_count_absolute: 0
    cost_absolute_usd: 0.000001
    cost_relative_percent: 0.1
    latency_absolute_ms: 5
    latency_relative_percent: 2
    null_is_not_zero: true
  outage_scenarios:
    - collector_absent_at_startup
    - collector_restart
    - dns_failure
    - blackhole
    - tls_failure
    - auth_failure
    - http_429
    - backend_5xx
    - queue_full
    - trace_pipeline_only_failure
    - log_pipeline_only_failure
    - metric_pipeline_only_failure
    - local_disk_queue_full
    - recovery_and_queue_drain
  outage_duration_minutes: 10
  allowed_business_terminal_state_delta: 0

observability_cutover:
  deterministic_replay_sampling_percent: 100
  dual_read_window_days: 7
  dual_read_min_runs: 10000
  categorical_and_digest_parity_percent: 100
  integer_count_delta: 0
  numeric_tolerance_ref: "telemetry.aggregation_tolerance"
  null_semantics: "missing remains null; never coerce to zero or success"
  rollback_restores_application_dual_write: false

evaluation:
  deterministic_mock_repetitions: 3
  live_judge:
    paired_repetitions: 5
    seeds:
      - 17
      - 29
      - 43
      - 71
      - 101
    confidence_level_percent: 95
    paired_bootstrap_resamples: 10000
  replay:
    default_mode: mock_or_read_only
    new_run_id_required: true
    new_effect_namespace_required: true
    production_credentials_allowed: false
    live_effect_requires_explicit_approval: true
  engine_canary:
    minimum_window_days: 14
    minimum_release_cycles: 2
    rule: "both minimums must be satisfied"
    min_comparable_runs_per_arm: 5000
    min_critical_scenario_runs_per_arm: 100
    quality_noninferiority_margin_percentage_points: 1
    error_rate_noninferiority_margin_percentage_points: 0.5
    p95_regression_max_percent: 10
    cost_per_success_regression_max_percent: 10
    confidence_level_percent: 95
    paired_bootstrap_resamples: 10000

suite_registry:
  release_gate:
    command: "RELEASE_GATE_FINAL=1 GATE_BASELINE_SHA=<approved-baseline-sha> bash scripts/release_gate.sh"
    required: true
  pr_e2e:
    command: "MAP_E2E_FINAL=1 python3 e2e/run_e2e.py --suite pr"
    required: true
  full_e2e:
    command: "MAP_E2E_FINAL=1 python3 e2e/run_e2e.py --suite full"
    required: true
    allowed_unapproved_skip: 0
    allowed_unapproved_xfail: 0
  required_categories:
    - static
    - unit
    - contract
    - integration
    - browser_e2e
    - fault_chaos
    - security
    - load_soak
    - evaluation
    - migration_dr

evidence_manifest:
  filename: evidence-manifest.json
  path_template: "tmp/acceptance/<TASK-ID>/<commit-sha>/<AC-ID>/evidence-manifest.json"
  schema: "TODO/evidence-manifest.schema.json"
  canonicalization: "RFC 8785 compatible canonical JSON"
  digest: sha256
  required_fields:
    - schema_version
    - task_id
    - ac_id
    - status
    - baseline_sha
    - implementation_sha
    - environment_digest
    - started_at
    - finished_at
    - command
    - exit_code
    - artifacts
    - assertions
    - finding_ids
    - waiver_id
    - waiver_owner
    - waiver_expires_at
    - not_applicable_reason
    - blocked_reason
    - blocker_owner
    - producer
  one_final_manifest_per_p0_p1_ac: true
