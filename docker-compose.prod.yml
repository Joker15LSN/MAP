# S4-06: production Compose override. Merge on top of docker-compose.yml:
#
#   MAP_ENV=prod scripts/compose-prod.sh up -d
#
# The base file defaults MAP_ENV to "dev" (${MAP_ENV:-dev}) for local dev.
# This override is the single place that removes that dev fallback:
# MAP_ENV becomes :?required (compose fails non-zero when it is unset), and
# the production entrypoint scripts/compose-prod.sh additionally refuses any
# value other than "prod" (dev/unknown -> non-zero). The three application
# services (algorithm-service / backend-service / worker-service) therefore
# can never silently boot in dev during a production deploy.
#
# CORS: the base compose defaults MAP_CORS_ORIGINS to "*" with credentials
# on. In production that combination is refused at startup by BOTH services
# (shared schema, fail-closed). This override therefore makes
# MAP_CORS_ORIGINS :?required (config fails non-zero when unset) and defaults
# MAP_CORS_ALLOW_CREDENTIALS to false, so a production deploy cannot silently
# inherit the base dev wildcard + credentials combination.
services:
  algorithm-service:
    environment:
      # S3-04: one frozen environment signal. ENV is the legacy reader
      # inside map_core; both resolve to prod here.
      ENV: prod
      MAP_ENV: ${MAP_ENV:?MAP_ENV is required for production deployments (must be "prod")}
      # S5-03: production CORS contract (same for both services). Origins
      # become :?required and credentials default false - never the base
      # dev default (* + true).
      MAP_CORS_ORIGINS: ${MAP_CORS_ORIGINS:?MAP_CORS_ORIGINS is required for production deployments}
      MAP_CORS_ALLOW_CREDENTIALS: ${MAP_CORS_ALLOW_CREDENTIALS:-false}

  backend-service:
    environment:
      MAP_ENV: ${MAP_ENV:?MAP_ENV is required for production deployments (must be "prod")}
      # S5-03: same production CORS contract as algorithm-service (origins
      # :?required, credentials default false - no service-internal default).
      MAP_CORS_ORIGINS: ${MAP_CORS_ORIGINS:?MAP_CORS_ORIGINS is required for production deployments}
      MAP_CORS_ALLOW_CREDENTIALS: ${MAP_CORS_ALLOW_CREDENTIALS:-false}

  worker-service:
    environment:
      MAP_ENV: ${MAP_ENV:?MAP_ENV is required for production deployments (must be "prod")}
