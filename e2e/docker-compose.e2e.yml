# R2-P1-05 Compose E2E override — merge on top of docker-compose.yml
# (and docker-compose.otel.yml for the OTel consistency checks):
#
#   python e2e/run_e2e.py
#
# Never run this file manually: the runner picks a RANDOM compose project
# name (fresh named volumes), unique container names (E2E_PREFIX) and free
# published ports, so an E2E run can never collide with or depend on the
# local dev stack (15432/27017/18080) or its data.
#
# The only fake in the topology is fake-llm (LLM boundary): algorithm-service
# keeps running the REAL map_core pipeline with MAP_LLM_BASE_URL pointed at
# the deterministic OpenAI-compatible fake.

services:
  postgres:
    container_name: ${E2E_PREFIX:-map-e2e}-postgres

  mongo:
    container_name: ${E2E_PREFIX:-map-e2e}-mongo

  # S6-02/S6-03: a REAL HTTP OpenSandbox 0.2.2 contract double with
  # per-Idempotency-Key dedup and observable server-side action counters
  # (/__counts). This is the provider whose exactly-once behavior the
  # sandbox worker-kill scenario proves; the real server image stays
  # pinned in the base compose (unpullable in this environment).
  opensandbox-double:
    image: python:3.13-slim
    container_name: ${E2E_PREFIX:-map-e2e}-opensandbox-double
    working_dir: /opt/double
    command: ["python", "opensandbox_double.py"]
    volumes:
      - ./e2e:/opt/double:ro
    ports:
      - "${E2E_SANDBOX_DOUBLE_PORT:-19998}:8099"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=5).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # Deterministic OpenAI-compatible fake at the LLM boundary ONLY.
  fake-llm:
    image: python:3.13-slim
    container_name: ${E2E_PREFIX:-map-e2e}-fake-llm
    working_dir: /opt/fake-llm
    command: ["python", "fake_llm_server.py"]
    volumes:
      - ./e2e:/opt/fake-llm:ro
    ports:
      # Published so the runner can drive /__e2e/config + /__e2e/stats.
      - "${E2E_FAKE_LLM_PORT:-19999}:9999"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/health', timeout=5).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  algorithm-service:
    container_name: ${E2E_PREFIX:-map-e2e}-algorithm-service
    # Stable image tag: the random project name must not force a full
    # rebuild on every run; later runs reuse this image (build cache).
    image: map-e2e/algorithm-service:latest
    environment:
      # LLM boundary fake: every real pipeline LLM call lands here.
      MAP_LLM_BASE_URL: http://fake-llm:9999/v1
      MAP_LLM_MODEL: fake-e2e-model
      MAP_LLM_API_KEY: e2e-fake-key
      # S6-02/S6-03: the sandbox execution link reaches the contract
      # double; the runner injects the one-shot credential registry.
      MAP_OPENSANDBOX_URL: ${MAP_OPENSANDBOX_URL:-http://opensandbox-double:8099}
      MAP_OPENSANDBOX_API_KEY: ${MAP_OPENSANDBOX_API_KEY:-e2e-sandbox-double-key}
      MAP_SANDBOX_SERVICE_CREDENTIALS: ${MAP_SANDBOX_SERVICE_CREDENTIALS:-}
      MAP_SANDBOX_SERVICE_AUDIENCE: ${MAP_SANDBOX_SERVICE_AUDIENCE:-map-core}
    depends_on:
      fake-llm:
        condition: service_healthy
      opensandbox-double:
        condition: service_healthy

  migrate:
    container_name: ${E2E_PREFIX:-map-e2e}-migrate
    image: map-e2e/backend:latest

  backend-service:
    container_name: ${E2E_PREFIX:-map-e2e}-backend-service
    image: map-e2e/backend:latest

  worker-service:
    container_name: ${E2E_PREFIX:-map-e2e}-worker-service
    image: map-e2e/backend:latest
    environment:
      # R3-P1-02 fault matrix: short lease so the worker-kill + lease
      # takeover scenario recovers in seconds instead of a full minute.
      # Heartbeat defaults to lease/4 and stays strictly below lease/3.
      MAP_WORKER_LEASE_SECONDS: "10"
      # R4-P1-01 fault-matrix controls (E2E-only, driven by run_e2e.py):
      # MAP_WORKER_ID pins the worker identity so the scenario can prove
      # the DB lease_owner equals the killed container's worker ID; the
      # barrier holds the handler at a deterministic in-flight crash
      # window; the effect probe registers an E2E-only idempotent effect
      # handler with a server-side fact table. All inert when unset.
      MAP_WORKER_ID: ${MAP_WORKER_ID:-}
      MAP_E2E_RECONCILE_BARRIER_S: ${MAP_E2E_RECONCILE_BARRIER_S:-0}
      MAP_E2E_EFFECT_PROBE: ${MAP_E2E_EFFECT_PROBE:-}
      MAP_E2E_EFFECT_BARRIER_S: ${MAP_E2E_EFFECT_BARRIER_S:-0}
      # S6-02/S6-03: the sandbox_exec worker auth + the crash window
      # AFTER the Core call returned (before the job complete).
      MAP_SANDBOX_CORE_TOKEN: ${MAP_SANDBOX_CORE_TOKEN:-}
      MAP_E2E_SANDBOX_AFTER_CORE_BARRIER_S: ${MAP_E2E_SANDBOX_AFTER_CORE_BARRIER_S:-0}

  frontend-service:
    container_name: ${E2E_PREFIX:-map-e2e}-frontend-service
    environment:
      # R3-P1-02: the browser E2E drives the real conversation UI; the
      # feature flag must be on for ConversationView to render.
      VITE_MAP_CONVERSATIONS_ENABLED: "true"

  observability-backend-service:
    container_name: ${E2E_PREFIX:-map-e2e}-observability-backend-service

  observability-frontend-service:
    container_name: ${E2E_PREFIX:-map-e2e}-observability-frontend-service

  otel-collector:
    container_name: ${E2E_PREFIX:-map-e2e}-otel-collector

  jaeger:
    container_name: ${E2E_PREFIX:-map-e2e}-jaeger
